name: FinTrack validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fintrack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fintrack/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:ledger
