name: Verify FinTrack Mont API

on:
  pull_request:
    paths:
      - "fintrack/api/**"
      - "fintrack/server/**"
      - "fintrack/tsconfig.api.json"
      - "fintrack/package.json"
      - "fintrack/vercel.json"
      - ".github/workflows/mont-api-check.yml"
  push:
    branches:
      - feature/mont-api-integration

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fintrack
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fintrack/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck API and build frontend
        run: npm run build
      - name: Smoke test emitted Node ESM imports
        run: |
          ./node_modules/.bin/tsc --project tsconfig.api.runtime.json
          node --input-type=module -e "await import('./.mont-api-runtime/api/mont/wallets.js'); await import('./.mont-api-runtime/api/mont/transactions.js'); const route = (await import('./.mont-api-runtime/api/mont/transactions-manage.js')).default; const r = await route.fetch(new Request('https://example.com/api/mont/transactions-manage')); if(r.status !== 503 || (await r.json()).error !== 'not_configured') process.exit(1); const forbidden = await route.fetch(new Request('https://example.com/api/mont/transactions-manage', { method: 'PUT' })); if(forbidden.status !== 405) process.exit(2); process.env.MONT_FINTRACK_API_KEY = 'x'.repeat(40); process.env.SUPABASE_URL = 'https://example.supabase.co'; process.env.SUPABASE_SECRET_KEY = 'fake-ci-secret'; process.env.FINTRACK_MONT_USER_ID = '6fb0b4cd-2ea7-4839-a6c7-9710f4baba30'; const unauthorized = await route.fetch(new Request('https://example.com/api/mont/transactions-manage')); if(unauthorized.status !== 401 || (await unauthorized.json()).error !== 'unauthorized') process.exit(3); console.log('API ESM imports and authorization smoke tests OK')"

          node --input-type=module -e "const route=(await import('./.mont-api-runtime/api/mont/financial-summary.js')).default; delete process.env.MONT_FINTRACK_API_KEY; const x=await route.fetch(new Request('https://example.com/api/mont/financial-summary')); if(x.status!==503 || (await x.json()).error!=='not_configured') process.exit(1); const y=await route.fetch(new Request('https://example.com/api/mont/financial-summary',{method:'POST'})); if(y.status!==405) process.exit(2); console.log('Financial summary authentication and read-only checks OK')"
