name: FinTrack typecheck and build

on:
  pull_request:
    branches: [main]
    paths:
      - 'fintrack/**'
      - '.github/workflows/fintrack-build.yml'
  push:
    branches: [main]
    paths:
      - 'fintrack/**'
      - '.github/workflows/fintrack-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fintrack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fintrack/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
