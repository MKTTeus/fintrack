name: FinTrack Quality Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fintrack
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fintrack/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Ledger tests
        run: npm run test:ledger
      - name: Production build
        run: npm run build
